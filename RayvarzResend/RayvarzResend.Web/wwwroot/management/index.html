<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدیریت — دستیار مالی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=48" />
  <link rel="stylesheet" href="management.css?v=4" />
  <style>
    body:not(.hub-authenticated) .container,
    body:not(.hub-authenticated) .page-bg {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="container hub-container">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-brand">
          <p class="brand-name">دستیار مالی</p>
        </div>
        <div class="hero-user" id="heroUser" hidden>
          <div class="user-meta">
            <span id="userDisplayName" class="user-name"></span>
            <span id="userRoleBadge" class="user-badge"></span>
          </div>
          <div class="hero-user-actions">
            <button id="btnChangePassword" class="btn secondary btn-sm" type="button">تغییر رمز</button>
            <button id="btnLogout" class="btn secondary btn-sm" type="button">خروج</button>
          </div>
        </div>
      </div>
    </header>

    <div id="hubEmpty" class="card hub-empty" hidden>
      <p>برای حساب شما هیچ فرمی تعریف نشده است. با ادمین تماس بگیرید.</p>
    </div>

    <section id="ruleGatePanel" class="card rule-gate-panel" hidden>
      <h2 class="rule-gate-title">به‌روزرسانی قوانین رایورز</h2>
      <p id="ruleGateStatus" class="rule-gate-status"></p>
      <dl id="ruleGateDetails" class="rule-gate-details"></dl>
      <div class="rule-gate-actions">
        <button id="btnRuleGateApprove" class="btn" type="button" hidden>تأیید به‌روزرسانی و باز کردن ارسال</button>
        <button id="btnRuleGateRefresh" class="btn secondary btn-sm" type="button">بررسی مجدد</button>
      </div>
    </section>

    <div id="hubGrid" class="hub-grid" role="list" hidden></div>
  </div>
  <dialog id="changePasswordDialog" class="change-password-dialog" dir="rtl">
    <form method="dialog" class="change-password-dialog-inner" onsubmit="return false;">
      <h2 class="change-password-title">تغییر رمز عبور</h2>
      <p class="field-hint change-password-hint">حداقل ۸ کاراکتر، حرف انگلیسی کوچک و بزرگ، و علامت (مثل @)</p>
      <label class="field field-required">
        <span class="field-label">رمز جدید</span>
        <div class="password-field-wrap">
          <input id="changePasswordNew" type="password" autocomplete="new-password" dir="ltr" />
          <button type="button" class="password-toggle-btn" aria-label="نمایش رمز" aria-pressed="false">👁</button>
        </div>
      </label>
      <label class="field field-required">
        <span class="field-label">تکرار رمز جدید</span>
        <div class="password-field-wrap">
          <input id="changePasswordConfirm" type="password" autocomplete="new-password" dir="ltr" />
          <button type="button" class="password-toggle-btn" aria-label="نمایش رمز" aria-pressed="false">👁</button>
        </div>
      </label>
      <p id="changePasswordError" class="login-error" hidden></p>
      <div class="actions change-password-actions">
        <button id="btnChangePasswordSubmit" class="btn primary" type="button">ثبت رمز جدید</button>
        <button id="btnChangePasswordClose" class="btn secondary" type="button">انصراف</button>
      </div>
    </form>
  </dialog>
  <script src="../js/password-fields.js?v=2"></script>
  <script src="../js/change-password.js?v=2"></script>
  <script src="management.js?v=8" type="module"></script>
</body>
</html>
