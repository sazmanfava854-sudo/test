<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود — دستیار مالی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=43" />
</head>
<body class="login-page">
  <div class="page-bg" aria-hidden="true"></div>
  <div class="container login-container">
    <section class="card login-card card-enter">
      <div class="card-head">
        <span class="card-icon" aria-hidden="true">🔐</span>
        <h1>ورود به دستیار مالی</h1>
      </div>
      <form id="loginForm" class="login-form">
        <label class="field field-required">
          <span class="field-label">نام کاربری سازمانی (دامین)</span>
          <input id="loginUsername" type="text" autocomplete="username" required placeholder="مثلاً alidoost-pa یا admin" />
        </label>
        <label class="field field-required">
          <span class="field-label">رمز عبور</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </label>
        <div class="actions">
          <button id="btnLogin" class="btn primary" type="submit">ورود</button>
        </div>
        <div id="loginSsoBlock" class="login-sso-block" hidden>
          <p class="login-sso-hint">کاربران سازمانی از ورود یکپارچه استفاده کنند.</p>
          <a id="btnSsoLogin" class="btn secondary" href="/auth/login">ورود سازمانی (SSO)</a>
        </div>
        <p id="loginError" class="login-error" hidden></p>
      </form>
    </section>
  </div>
  <script src="js/login.js?v=8"></script>
</body>
</html>
