<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ارسال مجدد به رایورز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="container">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-brand">
          <div class="hero-mark" aria-hidden="true">↻</div>
          <div>
            <p class="brand-name">Rayvarz Resend</p>
            <h1>ارسال مجدد فیش به رایورز</h1>
          </div>
        </div>
        <div id="configBadge" class="badge">...</div>
      </div>
    </header>

    <section class="card card-enter">
      <div class="card-head">
        <span class="card-icon" aria-hidden="true">📋</span>
        <h2>ورود فیش</h2>
      </div>
      <div class="form-grid">
        <label class="field">
          <span class="field-label">نوع شناسه</span>
          <select id="identifierType">
            <option value="FicheNo">شماره فیش (FicheNo)</option>
            <option value="BillPaymentKey">BillID + PaymentID</option>
          </select>
        </label>
        <label class="field field-wide">
          <span class="field-label">مقدار شناسه</span>
          <input id="identifierValue" type="text" placeholder="شماره فیش یا BillID+PaymentID" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">شعبه / منطقه</span>
          <select id="branch"></select>
        </label>
        <label class="field">
          <span class="field-label">کد منبع (Fund)</span>
          <select id="fund"></select>
        </label>
        <label class="field">
          <span class="field-label">DocDate</span>
          <input id="docDate" type="text" placeholder="1404/05/05" />
        </label>
        <label class="field">
          <span class="field-label">ActDate</span>
          <input id="actDate" type="text" placeholder="1404/05/05" />
        </label>
        <label class="field">
          <span class="field-label">Due</span>
          <input id="dueDate" type="text" placeholder="1404/05/05" />
        </label>
      </div>
      <div class="actions">
        <button id="btnLoad" class="btn primary" type="button">دریافت فیش</button>
        <button id="btnPreview" class="btn secondary" type="button" disabled>پیش‌نمایش XML</button>
        <button id="btnSend" class="btn danger" type="button" disabled>ارسال به رایورز</button>
      </div>
    </section>

    <section class="card card-enter" id="ficheSection" hidden>
      <div class="card-head">
        <span class="card-icon" aria-hidden="true">📄</span>
        <h2>اطلاعات فیش</h2>
      </div>
      <div id="ficheSummary" class="summary-grid"></div>

      <div class="subsection">
        <h3>مپینگ SOAP</h3>
        <div id="mappingTable" class="mapping-table"></div>
      </div>

      <div class="subsection">
        <h3>ردیف‌های IncmNo</h3>
        <div class="table-wrap">
          <table id="rowsTable">
            <thead>
              <tr><th>#</th><th>IncmNo</th><th>شرح</th><th>Val</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card card-enter" id="resultSection" hidden>
      <div class="card-head">
        <span class="card-icon" aria-hidden="true">✓</span>
        <h2>نتیجه ارسال</h2>
      </div>
      <pre id="resultBox" class="code-block"></pre>
    </section>

    <section class="card card-enter" id="xmlSection" hidden>
      <div class="card-head">
        <span class="card-icon" aria-hidden="true">&lt;/&gt;</span>
        <h2>XML پیش‌نمایش</h2>
      </div>
      <pre id="xmlBox" class="code-block"></pre>
    </section>

    <section class="card tahator-card card-enter">
      <div class="card-head">
        <span class="card-icon" aria-hidden="true">⇄</span>
        <h2>تهاتر</h2>
      </div>
      <div class="tahator-row">
        <label class="field field-grow">
          <span class="field-label">شماره فیش</span>
          <input id="tahatorFicheNo" type="text" placeholder="040933/318150" autocomplete="off" />
        </label>
        <div class="actions actions-inline">
          <button id="btnTahatorCheck" class="btn secondary" type="button">بررسی</button>
          <button id="btnTahatorSend" class="btn danger" type="button">ارسال به رایورز</button>
        </div>
      </div>
      <pre id="tahatorResultBox" class="code-block" hidden></pre>
    </section>
  </div>
  <script src="js/app.js?v=11" defer></script>
</body>
</html>
